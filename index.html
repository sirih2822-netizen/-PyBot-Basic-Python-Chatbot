<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyBot - Basic Python Chatbot</title>
    <meta name="description" content="CodeAlpha Task 4: A responsive rule-based Python and Flask chatbot implementing conditional logic, loops, functions, and structured input/output." />
    <meta property="og:title" content="PyBot - Basic Python Chatbot" />
    <meta property="og:description" content="CodeAlpha Task 4: A responsive rule-based Python and Flask chatbot implementing conditional logic, loops, functions, and structured input/output." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <!-- Centered Chat Application Container -->
    <main class="app-container" role="main">
      <div class="chat-card">
        
        <!-- Compact Header -->
        <header class="chat-header">
          <div class="brand-group">
            <div class="bot-avatar" aria-hidden="true">
              <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                <circle cx="12" cy="5" r="2"></circle>
                <path d="M12 7v4"></path>
                <line x1="8" y1="16" x2="8" y2="16"></line>
                <line x1="16" y1="16" x2="16" y2="16"></line>
              </svg>
            </div>
            <div class="brand-info">
              <h1 class="brand-title">PyBot</h1>
              <div class="status-indicator">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-label">Online</span>
              </div>
            </div>
          </div>

          <div class="header-actions">
            <button type="button" id="clearChatBtn" class="btn-clear" title="Clear conversation" aria-label="Clear Chat">
              <svg class="icon-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              </svg>
              <span>Clear</span>
            </button>
          </div>
        </header>

        <!-- Scrollable Conversation Area -->
        <section id="chatWindow" class="chat-window" aria-live="polite" aria-label="Chat messages">
          <div id="messagesList" class="messages-list">
            <!-- Initial Welcome Message and suggestions populated by JavaScript -->
          </div>

          <!-- Typing Indicator -->
          <div id="typingIndicator" class="typing-indicator hidden" aria-hidden="true">
            <div class="typing-bubble">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
          </div>
        </section>

        <!-- Message Composer Area -->
        <footer class="composer-container">
          <div id="statusAlert" class="status-alert hidden" role="alert"></div>

          <form id="chatForm" class="composer-form" autocomplete="off">
            <label for="messageInput" class="sr-only">Type your message</label>
            <input 
              type="text" 
              id="messageInput" 
              class="composer-input" 
              placeholder="Type your message..." 
              maxlength="500" 
              autofocus 
              required 
              aria-label="Type your message"
            />
            <button 
              type="submit" 
              id="sendBtn" 
              class="btn-send" 
              title="Send message" 
              aria-label="Send message" 
              disabled
            >
              <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </footer>

        <!-- Bottom Card Subtitle -->
        <div class="chat-card-footer">
          <small>Python rule-based chatbot &bull; CodeAlpha Task 4</small>
        </div>

      </div>
    </main>

    <script src="/static/js/app.js"></script>
  </body>
</html>
